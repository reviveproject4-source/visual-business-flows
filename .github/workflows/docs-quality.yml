name: Documentation quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Markdown formatting
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"
      - name: Install pinned Mermaid CLI
        run: npm install --no-save --no-package-lock @mermaid-js/mermaid-cli@11.4.2
      - name: Validate and render every Mermaid block
        run: python3 scripts/validate_mermaid.py
